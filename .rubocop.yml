plugins:
  - rubocop-rake
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - "docs/superpowers/**/*" # gitignored scratch/planning material (probe scripts etc.)

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Layout/EndOfLine:
  EnforcedStyle: lf

Layout/LineLength:
  Max: 120

Metrics/MethodLength:
  Max: 25

Metrics/AbcSize:
  Max: 25

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "lib/psn_client/models/*.rb" # Data.define blocks

Metrics/ClassLength:
  Exclude:
    - "lib/psn_client/resources/catalog.rb" # one class per API area; the store catalog is the largest

RSpec/ExampleLength:
  Max: 15

RSpec/DescribeClass:
  Exclude:
    - "spec/psn_client/models/trophy_models_spec.rb"
    - "spec/psn_client/models/store_models_spec.rb"
    - "spec/psn_client/models/library_models_spec.rb"
    - "spec/psn_client/models/catalog_detail_models_spec.rb"
    - "spec/psn_client/models/group_models_spec.rb"

RSpec/SpecFilePathFormat:
  CustomTransform:
    PSN: psn_client
  Exclude:
    - "spec/psn_client/errors_spec.rb"
    - "spec/psn_client/models/*_spec.rb"

RSpec/MultipleDescribes:
  Exclude:
    - "spec/psn_client/models/game_help_spec.rb"

RSpec/MultipleExpectations:
  Max: 5
  Exclude:
    - "spec/psn_client/models/**/*_spec.rb"
