plugins:
  - rubocop-rake
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Layout/EndOfLine:
  EnforcedStyle: lf

Layout/LineLength:
  Max: 120

Metrics/MethodLength:
  Max: 25

Metrics/AbcSize:
  Max: 25

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "lib/psn_client/models/*.rb" # Data.define blocks

RSpec/ExampleLength:
  Max: 15

RSpec/DescribeClass:
  Exclude:
    - "spec/psn_client/models/trophy_models_spec.rb"
    - "spec/psn_client/models/store_models_spec.rb"
    - "spec/psn_client/models/library_models_spec.rb"

RSpec/SpecFilePathFormat:
  CustomTransform:
    PSN: psn_client
  Exclude:
    - "spec/psn_client/errors_spec.rb"
    - "spec/psn_client/models/catalog_item_spec.rb"
    - "spec/psn_client/models/game_help_spec.rb"
    - "spec/psn_client/models/game_title_spec.rb"
    - "spec/psn_client/models/price_spec.rb"
    - "spec/psn_client/models/profile_spec.rb"
    - "spec/psn_client/models/star_rating_spec.rb"
    - "spec/psn_client/models/store_concept_spec.rb"
    - "spec/psn_client/models/store_product_spec.rb"
    - "spec/psn_client/models/trophy_models_spec.rb"
    - "spec/psn_client/models/user_search_result_spec.rb"
    - "spec/psn_client/models/library_models_spec.rb"

RSpec/MultipleDescribes:
  Exclude:
    - "spec/psn_client/models/game_help_spec.rb"

RSpec/MultipleExpectations:
  Max: 5
  Exclude:
    - "spec/psn_client/models/**/*_spec.rb"
